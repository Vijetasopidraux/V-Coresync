<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Construction Hub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#app">Skip to content</a>
<aside id="side" class="side">
  <div class="brand"><span class="logo" aria-hidden="true">▦</span><b id="brand">Construction Hub</b></div>
  <nav id="nav" aria-label="Main"></nav>
</aside>
<div id="ovl" class="ovl"></div>
<div class="shell">
  <header class="top">
    <button id="menu" class="ic" aria-label="Menu">☰</button>
    <h1 id="title"></h1>
    <div class="tools">
      <select id="projSel" aria-label="Project"></select>
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="id">ID</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <span class="av" role="img" aria-label="Profile">CH</span>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <div class="fab">
    <button type="button" class="btn" data-go="progress" id="fab1"></button>
    <button type="button" class="btn dark" data-go="defects" id="fab2"></button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="script.js"></script>
</body>
</html>
